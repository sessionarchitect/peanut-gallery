<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peanut Gallery · Controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111418;overscroll-behavior:none}
*{scrollbar-width:none;-ms-overflow-style:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none;width:0;height:0}
.av{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
div:hover > .av{transform:rotate(-14deg) scale(1.08)}
.seg{transition:border-radius .45s cubic-bezier(.34,1.56,.64,1),background-color .25s ease,color .25s ease !important}
a{color:inherit}a:hover{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid #9CCFBE;outline-offset:3px}
.sw{cursor:pointer}
.sw .track{transition:background-color .3s ease}
.sw .knob{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sw.on .knob{transform:translateX(20px)}
.sw:hover .knob{box-shadow:0 0 0 6px rgba(156,207,190,.18)}
.seg{cursor:pointer;transition:background-color .25s ease,color .25s ease}
.pchip{cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s ease}
.pchip:hover{transform:translateY(-2px)}
.pchip.off{opacity:.5}
.pchip.off .nm{text-decoration:line-through}
.big{cursor:pointer;transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s ease}
.big:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.nav a{transition:opacity .2s ease}.nav a:hover{opacity:1 !important}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 100%; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Roboto Flex', sans-serif; background-color: {{t.bg}}; color: {{t.text}}">
<div class="scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 26px 20px 20px 20px">
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 36px; line-height: 1; font-weight: 860; font-variation-settings: 'wdth' 130; letter-spacing: -0.025em">Controls</h1>
<span style="font-size: 14px; color: {{t.muted}}">You're the fly. You're also the boss.</span>
</header>
<section style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 24px; background-color: {{t.accentSoft}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 700">Pause every chat</span>
<span style="font-size: 13px; color: {{t.muted}}">{{pauseHint}}</span>
</span>
<button class="sw {{sw.pauseAll.cls}}" onClick="{{sw.pauseAll.toggle}}" aria-pressed="{{sw.pauseAll.pressed}}" aria-label="Pause every chat" style="width: 52px; height: 44px; flex-shrink: 0; border: none; background-color: transparent; padding: 0; display: flex; align-items: center">
<span class="track" style="width: 48px; height: 28px; border-radius: 14px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; background-color: {{sw.pauseAll.track}}"><span class="knob" style="width: 20px; height: 20px; border-radius: 10px; background-color: {{sw.pauseAll.knob}}"></span></span>
</button>
</div>
<button class="big" onClick="{{stopToday}}" style="height: 48px; border-radius: 24px; border: none; font-size: 15px; font-weight: 700; background-color: {{t.accent}}; color: {{t.accentInk}}">{{stopText}}</button>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Mute a chat</h2>
<div style="display: flex; flex-direction: column; border-radius: 22px; padding: 4px 6px 4px 14px; background-color: {{t.surf}}">
<sc-for list="{{chats}}" as="c" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid {{c.border}}">
<span class="av" style="width: 38px; height: 38px; flex-shrink: 0; clip-path: {{c.shape}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: #1B1E22; background-color: {{c.color}}">{{c.mono}}</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
<button class="sw {{c.cls}}" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" aria-label="{{c.label}}" style="width: 52px; height: 44px; flex-shrink: 0; border: none; background-color: transparent; padding: 0; display: flex; align-items: center">
<span class="track" style="width: 48px; height: 28px; border-radius: 14px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; background-color: {{c.track}}"><span class="knob" style="width: 20px; height: 20px; border-radius: 10px; background-color: {{c.knob}}"></span></span>
</button>
</div>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Mute a person everywhere</h2>
<span style="font-size: 13px; color: {{t.muted}}">They'll still talk. You just won't have to read it.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="7">
<button class="pchip {{p.cls}}" onClick="{{p.toggle}}" aria-pressed="{{p.pressed}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: none; background-color: {{t.surf}}; color: {{t.text}}">
<span style="width: 28px; height: 28px; clip-path: {{p.shape}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #1B1E22; background-color: {{p.color}}">{{p.initial}}</span>
<span class="nm" style="font-size: 13px; font-weight: 600">{{p.name}}</span>
</button>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">How it feels</h2>
<sc-for list="{{segs}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">{{g.label}}</span>
<div role="radiogroup" aria-label="{{g.label}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
<button class="seg" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="height: 44px; border-radius: {{o.radius}}; border: none; font-size: 14px; font-weight: 650; background-color: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: {{t.muted}}">{{g.hint}}</span>
</div>
</sc-for>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">House rules</h2>
<div style="display: flex; flex-direction: column; border-radius: 22px; padding: 4px 6px 4px 16px; background-color: {{t.surf}}">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid {{r.border}}">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 12px; color: {{t.muted}}">{{r.hint}}</span>
</span>
<button class="sw {{r.cls}}" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" aria-label="{{r.name}}" style="width: 52px; height: 44px; flex-shrink: 0; border: none; background-color: transparent; padding: 0; display: flex; align-items: center">
<span class="track" style="width: 48px; height: 28px; border-radius: 14px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; background-color: {{r.track}}"><span class="knob" style="width: 20px; height: 20px; border-radius: 10px; background-color: {{r.knob}}"></span></span>
</button>
</div>
</sc-for>
</div>
</section>
</div>
<nav class="nav" aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 80px; flex-shrink: 0; background-color: {{t.surf}}">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; opacity: 0.75; color: {{t.text}}">
<span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>
Chats
</a>
<a href="Verdict.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 600; opacity: 0.75; color: {{t.text}}">
<span style="height: 30px; display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"></path><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M9 3c0 1.5 1 1.5 1 3M13 3c0 1.5 1 1.5 1 3"></path></svg></span>
The Tea
</a>
<a href="Builder.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 700; color: {{t.text}}">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background-color: {{t.accentSoft}}; color: {{t.accentText}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>
Controls
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Night","Day"],"default":"Night"},"$preview":{"width":412,"height":915}}'>
var THEMES = {
  Night: { bg: '#111418', surf: '#191D22', surf2: '#2B323B', line: '#20252B', text: '#ECEEF0', muted: '#9BA4AE', accent: '#9CCFBE', accentInk: '#0F1D19', accentSoft: '#1F2F2A', accentText: '#A8DCCB', trackOff: '#3A434D', knobOff: '#9BA4AE' },
  Day: { bg: '#F4F2EE', surf: '#FFFFFF', surf2: '#EFECE6', line: '#E6E2DA', text: '#22262B', muted: '#5C626A', accent: '#2F7563', accentInk: '#FFFFFF', accentSoft: '#D7EAE3', accentText: '#255E50', trackOff: '#D3CFC6', knobOff: '#FFFFFF' }
};
var SHAPE_FN = {
  circle: function () { return 0.5; },
  cookie: function (t) { return 0.5 * (1 + 0.07 * Math.cos(9 * (t + Math.PI / 2))); },
  clover: function (t) { return 0.5 * (1 + 0.2 * Math.cos(4 * t)); },
  sunny: function (t) { return 0.5 * (1 + 0.05 * Math.cos(8 * t)); },
  flower: function (t) { return 0.5 * (1 + 0.12 * Math.cos(6 * t)); },
  gem: function (t) { return 0.5 * (1 + 0.06 * Math.cos(6 * t + Math.PI)); },
  burst: function (t) { return 0.5 * (1 + 0.085 * Math.cos(12 * t)); },
  squircle: function (t) { var c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t)); return 0.5 / Math.pow(Math.pow(c, 4) + Math.pow(s, 4), 0.25); }
};
var SHAPE_CACHE = {};
function shape(k) {
  if (SHAPE_CACHE[k]) { return SHAPE_CACHE[k]; }
  var f = SHAPE_FN[k] || SHAPE_FN.circle, pts = [], n = 56, i;
  for (i = 0; i < n; i++) { var a = 2 * Math.PI * i / n - Math.PI / 2, r = f(a); pts.push([0.5 + r * Math.cos(a), 0.5 + r * Math.sin(a)]); }
  var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
  var mnx = Math.min.apply(null, xs), mxx = Math.max.apply(null, xs), mny = Math.min.apply(null, ys), mxy = Math.max.apply(null, ys);
  var sc = 1 / Math.max(mxx - mnx, mxy - mny), cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2;
  SHAPE_CACHE[k] = 'polygon(' + pts.map(function (p) { return ((0.5 + (p[0] - cx) * sc) * 100).toFixed(1) + '% ' + ((0.5 + (p[1] - cy) * sc) * 100).toFixed(1) + '%'; }).join(',') + ')';
  return SHAPE_CACHE[k];
}
var CSH = { family: 'cookie', office: 'squircle', hoa: 'gem', book: 'flower', er: 'clover' };
var PSH = { linda: 'cookie', rick: 'squircle', june: 'flower', tyler: 'burst', mia: 'clover', gary: 'gem', priya: 'sunny' };
var CHATS = [
  { id: 'family', name: 'Henderson Family', mono: 'HF', color: '#E8B79E' },
  { id: 'office', name: 'Q3 Synergy Task Force', mono: 'Q3', color: '#C9C4B5' },
  { id: 'hoa', name: 'Lakeview HOA (Official)', mono: 'HOA', color: '#A7C7C2' },
  { id: 'book', name: 'Book Club (We Don’t Read)', mono: 'BC', color: '#D9A3B0' },
  { id: 'er', name: 'Night Shift, Bay 4', mono: 'ER', color: '#9DBFA8' }
];
var PEOPLE = [
  { id: 'linda', name: 'Linda', color: '#E8B79E' },
  { id: 'rick', name: 'Rick', color: '#9EC1E0' },
  { id: 'june', name: 'Grandma June', color: '#B8A9D9' },
  { id: 'tyler', name: 'Tyler', color: '#E6D58F' },
  { id: 'mia', name: 'Mia', color: '#9DBFA8' },
  { id: 'gary', name: 'Gary', color: '#C9C4B5' },
  { id: 'priya', name: 'Priya', color: '#D9A3B0' }
];
var SEGS = [
  { id: 'pace', label: 'Pace', opts: ['Chill', 'Normal', 'Binge'], hints: { Chill: 'A message every few seconds. Good for falling asleep to.', Normal: 'Like a real group chat that never sleeps.', Binge: 'Everyone types at once. Bring snacks.' } },
  { id: 'spice', label: 'Spice', opts: ['Cozy', 'Snarky', 'Pitch black'], hints: { Cozy: 'Gentle teasing. Grandma is on her best behavior.', Snarky: 'Sarcasm, satire, and passive-aggressive thumbs-ups.', 'Pitch black': 'Dark humor about death, taxes, and the HOA.' } }
];
var RULES = [
  { id: 'up', name: 'Punch up, not down', hint: 'Jokes aim at bosses, systems, and Gary.' },
  { id: 'sleep', name: 'New drama while I sleep', hint: 'Wake up to a recap of what you missed.' },
  { id: 'quiet', name: 'Quiet hours, 11pm to 7am', hint: 'No pings. The chats keep going quietly.' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pauseAll: false, stopped: false, muted: { hoa: true }, mutedP: { gary: false }, pace: 'Normal', spice: 'Snarky', up: true, sleep: true, quiet: false };
  }
  sw(on, t) { return { cls: on ? 'on' : '', pressed: on ? 'true' : 'false', track: on ? t.accent : t.trackOff, knob: on ? t.accentInk : t.knobOff }; }
  renderVals() {
    var self = this;
    var st = this.state;
    var t = THEMES[this.props.theme] || THEMES.Night;
    var pa = this.sw(st.pauseAll, t);
    pa.toggle = function () { self.setState({ pauseAll: !st.pauseAll }); };
    var chats = CHATS.map(function (c, i) {
      var m = !!st.muted[c.id];
      var s = self.sw(m, t);
      s.name = c.name; s.mono = c.mono; s.color = c.color; s.shape = shape(CSH[c.id]);
      s.label = (m ? 'Unmute ' : 'Mute ') + c.name;
      s.border = i === CHATS.length - 1 ? 'transparent' : t.line;
      s.toggle = function () { var o = Object.assign({}, st.muted); o[c.id] = !m; self.setState({ muted: o }); };
      return s;
    });
    var people = PEOPLE.map(function (p) {
      var m = !!st.mutedP[p.id];
      return {
        name: p.name, color: p.color, initial: p.id === 'june' ? 'J' : p.name.charAt(0), shape: shape(PSH[p.id]),
        cls: m ? 'off' : '', pressed: m ? 'true' : 'false',
        toggle: function () { var o = Object.assign({}, st.mutedP); o[p.id] = !m; self.setState({ mutedP: o }); }
      };
    });
    var segs = SEGS.map(function (g) {
      return {
        label: g.label, hint: g.hints[st[g.id]],
        opts: g.opts.map(function (o, i) {
          var on = st[g.id] === o;
          var rad = on ? '20px' : (i === 0 ? '20px 8px 8px 20px' : i === g.opts.length - 1 ? '8px 20px 20px 8px' : '8px');
          return { label: o, radius: rad, checked: on ? 'true' : 'false', bg: on ? t.accent : t.surf2, fg: on ? t.accentInk : t.text, pick: function () { var x = {}; x[g.id] = o; self.setState(x); } };
        })
      };
    });
    var rules = RULES.map(function (r, i) {
      var on = !!st[r.id];
      var s = self.sw(on, t);
      s.name = r.name; s.hint = r.hint;
      s.border = i === RULES.length - 1 ? 'transparent' : t.line;
      s.toggle = function () { var x = {}; x[r.id] = !on; self.setState(x); };
      return s;
    });
    return {
      t: t,
      sw: { pauseAll: pa },
      pauseHint: st.pauseAll ? 'Everyone is frozen mid-sentence.' : 'Freeze everyone mid-sentence.',
      stopText: st.stopped ? 'Resume listening' : 'Stop listening for today',
      stopToday: function () { self.setState({ stopped: !st.stopped }); },
      chats: chats, people: people, segs: segs, rules: rules
    };
  }
}
</script>
</body>
</html>
